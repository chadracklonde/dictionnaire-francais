name: dictionnaire
description: Dictionnaire français hors ligne (contenu du Wiktionnaire, CC BY-SA 4.0).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dictionnaire_engine:
    path: ../engine
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/conjugation_models.json

flutter_launcher_icons:
  image_path: assets/icon/logo.png
  android: true
  adaptive_icon_background: "#1B5E8C"
  adaptive_icon_foreground: assets/icon/logo_foreground.png
  windows:
    generate: true
    image_path: assets/icon/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/logo.png
