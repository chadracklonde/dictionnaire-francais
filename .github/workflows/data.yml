name: Générer la base de données

# À lancer à la main (onglet Actions > Run workflow) en donnant l'adresse du
# fichier JSONL français de kaikki.org.
on:
  workflow_dispatch:
    inputs:
      jsonl_url:
        description: "URL du fichier JSONL (.jsonl ou .jsonl.gz) du français"
        required: true
      limit:
        description: "Limiter le nombre d'entrées (vide = tout)"
        required: false
        default: ""

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Télécharger les données
        run: curl -L --fail -o data.jsonl.gz "${{ inputs.jsonl_url }}"
      - name: Aperçu de la structure des données
        run: |
          python3 - <<'PY2'
          import gzip, json
          n = 0; keys = {}; langs = {}
          with gzip.open("data.jsonl.gz", "rt", encoding="utf-8") as f:
              for i, line in enumerate(f):
                  if i >= 20000: break
                  try: e = json.loads(line)
                  except Exception: continue
                  langs[e.get("lang_code")] = langs.get(e.get("lang_code"), 0) + 1
                  if e.get("lang_code") == "fr":
                      for k in e: keys[k] = keys.get(k, 0) + 1
                      if e.get("word") == "lire" and e.get("pos") == "verb":
                          print("::notice::FORMES-LIRE " + json.dumps([f.get("form") for f in e.get("forms", [])], ensure_ascii=False)[:1500])
                      if n < 2:
                          print("::notice::EXEMPLE " + json.dumps(e, ensure_ascii=False)[:900].replace("\n", " "))
                      n += 1
          sk = {}; tg = {}; infl = 0
          with gzip.open("data.jsonl.gz", "rt", encoding="utf-8") as f:
              for i, line in enumerate(f):
                  if i >= 20000: break
                  try: e = json.loads(line)
                  except Exception: continue
                  if e.get("lang_code") != "fr": continue
                  for t in e.get("tags", []): tg[t] = tg.get(t, 0) + 1
                  for s_ in e.get("senses", []):
                      for k in s_: sk[k] = sk.get(k, 0) + 1
                  if any(("form_of" in s_ or "alt_of" in s_) for s_ in e.get("senses", [])) and infl < 2:
                      print("::notice::FLECHI " + json.dumps(e, ensure_ascii=False)[:700].replace("\\n", " "))
                      infl += 1
          print("::notice::CLES-SENS " + json.dumps(sk, ensure_ascii=False))
          print("::notice::TAGS " + json.dumps(dict(sorted(tg.items(), key=lambda x: -x[1])[:30]), ensure_ascii=False))
          print("::notice::LANGUES(20000 premieres lignes) " + json.dumps(dict(sorted(langs.items(), key=lambda x: -x[1])[:8])))
          print("::notice::CHAMPS fr " + json.dumps(keys, ensure_ascii=False))
          PY2
      - name: Importer
        working-directory: tools
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="--limit ${{ inputs.limit }}"; fi
          set +e
          python3 import_wiktionnaire.py ../data.jsonl.gz ../dictionnaire.db $ARGS > ../import.log 2>&1
          code=$?
          echo "::notice::IMPORT code=$code $(tail -n 12 ../import.log | tr '\n' ' ' | cut -c1-900)"
          [ $code -eq 0 ] || exit $code
          python3 report_db.py ../dictionnaire.db | tee ../rapport_base.txt
      - name: Vérifier la conjugaison
        working-directory: tools
        run: |
          python3 verify_conjugation.py ../dictionnaire.db --csv ../ecarts.csv --diag ../diag.txt --probe organiser,abandonner,aimer,finir,baliser | tee ../rapport.txt
          echo "::notice::CONJUGAISON $(head -c 600 ../rapport.txt | paste -sd'|')"
          echo "::notice::DIAGNOSTIC-A $(head -c 2500 ../diag.txt | paste -sd'|')"
          echo "::notice::DIAGNOSTIC-B $(grep '^SONDE' ../diag.txt | cut -c1-900 | paste -sd'|')"
      - name: Publier la base dans les Releases (import complet seulement)
        if: ${{ inputs.limit == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -9 -k dictionnaire.db
          gh release view base-donnees >/dev/null 2>&1 || gh release create base-donnees \
            --title "Base de données du dictionnaire" \
            --notes "Base SQLite générée à partir du Wiktionnaire (fr.wiktionary.org) par kaikki.org / wiktextract. Licence CC BY-SA 4.0 : https://creativecommons.org/licenses/by-sa/4.0/deed.fr — contenu modifié (restructuré, allégé) pour l'application."
          gh release upload base-donnees dictionnaire.db.gz --clobber
          ls -la dictionnaire.db dictionnaire.db.gz
          echo "::notice::RELEASE publiée : $(ls -la dictionnaire.db.gz | awk '{print $5}') octets compressés"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-et-rapport
          path: |
            dictionnaire.db
            ecarts.csv
            rapport.txt
            import.log
            rapport_base.txt
