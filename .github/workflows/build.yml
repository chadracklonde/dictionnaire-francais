name: Compiler l'application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Tests Python (import + conjugaison)
        run: |
          cd tools
          python3 test_conjugation.py
          python3 import_wiktionnaire.py sample.jsonl /tmp/test.db
          python3 test_import.py /tmp/test.db
      - name: Tests du moteur Dart
        run: |
          cd engine
          dart pub get
          dart test

  android:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Base de données complète (si publiée)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base
          if gh release download base-donnees -p dictionnaire.db.gz -D /tmp/base 2>/dev/null; then
            gunzip -f /tmp/base/dictionnaire.db.gz
            python tools/build_assets.py /tmp/base/dictionnaire.db
          else
            echo "Aucune base publiée : base de démonstration conservée."
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Préparer le projet
        working-directory: app
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          intents='<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>'
          import re
          s=re.sub(r'android:label="[^"]*"','android:label="Dictionnaire et Conjugaison"',s,count=1)
          if '<queries>' in s:
              s=s.replace('<queries>','<queries>'+intents,1)
          else:
              s=s.replace('<application','<queries>'+intents+'</queries>\n    <application',1)
          perms='<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>'
          s=s.replace('<application',perms+'\n    <application',1)
          receivers='<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/><receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/><action android:name="android.intent.action.QUICKBOOT_POWERON"/><action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/></intent-filter></receiver>'
          s=s.replace('</application>',receivers+'\n    </application>',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          python3 - <<'PY'
          import os
          lib='com.android.tools:desugar_jdk_libs:2.1.4'
          kts='android/app/build.gradle.kts'
          grv='android/app/build.gradle'
          if os.path.exists(kts):
              s=open(kts,encoding='utf-8').read()
              s=s.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
              dep='dependencies {\n    coreLibraryDesugaring("'+lib+'")\n}\n'
              if 'dependencies {' in s:
                  s=s.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("'+lib+'")',1)
              else:
                  s+='\n'+dep
              open(kts,'w',encoding='utf-8').write(s)
          elif os.path.exists(grv):
              s=open(grv,encoding='utf-8').read()
              s=s.replace('compileOptions {','compileOptions {\n        coreLibraryDesugaringEnabled true',1)
              dep="dependencies {\n    coreLibraryDesugaring '"+lib+"'\n}\n"
              if 'dependencies {' in s:
                  s=s.replace('dependencies {',"dependencies {\n    coreLibraryDesugaring '"+lib+"'",1)
              else:
                  s+='\n'+dep
              open(grv,'w',encoding='utf-8').write(s)
          PY
          flutter pub get
          dart run flutter_launcher_icons -f icons_config/android.yaml
      - name: Analyse
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyse.txt 2>&1 || { echo "::error::ANALYSE $(grep -E '^ *error' analyse.txt | head -8 | sed 's/^ *//' | paste -sd'|' | cut -c1-1500)"; exit 1; }
      - name: APK
        working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dictionnaire-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Base de données complète (si publiée)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base
          if gh release download base-donnees -p dictionnaire.db.gz -D /tmp/base 2>/dev/null; then
            gunzip -f /tmp/base/dictionnaire.db.gz
            python tools/build_assets.py /tmp/base/dictionnaire.db
          else
            echo "Aucune base publiée : base de démonstration conservée."
          fi
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Compiler
        working-directory: app
        run: |
          flutter create --platforms=windows .
          sed -i 's/L"dictionnaire"/L"Dictionnaire et Conjugaison"/' windows/runner/main.cpp
          flutter pub get
          dart run flutter_launcher_icons -f icons_config/windows.yaml
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: dictionnaire-windows
          path: app/build/windows/x64/runner/Release

  macos:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Base de données complète (si publiée)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base
          if gh release download base-donnees -p dictionnaire.db.gz -D /tmp/base 2>/dev/null; then
            gunzip -f /tmp/base/dictionnaire.db.gz
            python tools/build_assets.py /tmp/base/dictionnaire.db
          else
            echo "Aucune base publiée : base de démonstration conservée."
          fi
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Préparer le projet
        working-directory: app
        run: |
          flutter create --platforms=macos .
          # accès réseau (lien Wiktionnaire) dans le bac à sable macOS
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$f" || true
          done
          flutter pub get
          dart run flutter_launcher_icons -f icons_config/macos.yaml > icones.txt 2>&1 || { echo "::warning::Icône macOS non générée : $(tr '\n' ' ' < icones.txt | cut -c1-600)"; }
      - name: Compiler
        working-directory: app
        run: flutter build macos --release
      - name: Archiver
        run: ditto -c -k --keepParent app/build/macos/Build/Products/Release/dictionnaire.app dictionnaire-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dictionnaire-macos
          path: dictionnaire-macos.zip
